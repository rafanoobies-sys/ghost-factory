<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rico's Cleaning</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Rico's Cleaning</h1>
    <p>Your trusted local service</p>
  </header>

  <main>
    <section class="hero">
      <h2>We help customers find you</h2>
      <p>Fast, reliable, and local.</p>
      <a href="#contact" class="cta">Get in touch</a>
    </section>

    <section id="contact">
      <h2>Contact Us</h2>
      <form>
        <input type="text" placeholder="Your name" required />
        <input type="email" placeholder="Your email" required />
        <textarea placeholder="Your message"></textarea>
        <button type="submit">Send</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Rico's Cleaning. All rights reserved.</p>
  </footer>
</body>
</html>
